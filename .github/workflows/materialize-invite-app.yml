name: materialize-invite-app
on:
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/relative-readings-mvp
      - name: Materialize public/invite/app.js full-reading UI
        run: |
          python3 - <<'PY'
          import gzip, base64, pathlib
          b64 = ""
          raw = gzip.decompress(base64.b64decode(b64))
          pathlib.Path("public/invite/app.js").write_bytes(raw)
          print("wrote", len(raw), "bytes")
          PY
      - name: Commit materialized source and remove this workflow
        run: |
          git config user.name "relative-readings-bot"
          git config user.email "bot@users.noreply.github.com"
          rm -f .github/workflows/materialize-invite-app.yml
          git add public/invite/app.js
          git add -u .github/workflows/materialize-invite-app.yml || true
          git commit -m "fix(relative-readings): materialize invite app.js full-reading UI (readable source)"
          git push
