name: shiru
description: "Shiru – a playful DIY audio player for kids."
publish_to: 'none'
version: 1.0.1+2

environment:
  sdk: ^3.10.7

dependencies:
  cupertino_icons: ^1.0.8
  file_picker: ^10.3.10
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^17.1.0
  image_picker: ^1.2.1
  intl: ^0.20.2
  just_audio: ^0.10.5
  path: ^1.9.1
  path_provider: ^2.1.5
  permission_handler: ^11.3.0
  record: ^6.0.0
  shared_preferences: ^2.3.2
  share_plus: ^10.1.2
  sqflite_sqlcipher: ^2.2.1
  flutter_secure_storage: ^9.2.4
  uuid: ^4.5.3
  video_player: ^2.10.1
  package_info_plus: ^9.0.0
  wakelock_plus: ^1.5.1
  http: ^1.2.0
  flutter_dotenv: ^5.2.1
  google_fonts: ^6.2.1
  firebase_core: ^4.6.0
  firebase_auth: ^6.5.4
  cloud_firestore: ^6.6.0
  cloud_functions: ^6.3.3
  firebase_app_check: ^0.4.5
  firebase_analytics: ^12.2.0
  firebase_crashlytics: ^5.1.0
  google_sign_in: ^7.2.0
  flutter_tts: ^4.2.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/app_icon.png
    - assets/.env
    - assets/storytime/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#243B67"
  adaptive_icon_foreground: "assets/images/app_icon.png"
  remove_alpha_ios: true
