<!doctype html>
<!-- Relative Readings MVP — full-story invite capture page.
     Contracts: redeemVoiceInvite, prepareStoryInviteUpload, submitStoryInviteReading.
     app.js owns all UI under #app via innerHTML + event delegation. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="description" content="Record a story reading for a child on Shiru." />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#fdf6ec" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#201b13" media="(prefers-color-scheme: dark)" />
    <link rel="preconnect" href="https://www.gstatic.com" crossorigin />
    <title>Record a story — Shiru</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main id="app" aria-live="polite">
      <section class="screen screen-center" aria-busy="true">
        <div class="spinner" aria-hidden="true"></div>
        <p class="loading-line">Loading…</p>
      </section>
    </main>
    <noscript>
      <p class="noscript-banner">This page requires JavaScript to record. Please enable JavaScript and reload.</p>
    </noscript>
    <script type="module" src="./app.js"></script>
  </body>
</html>
